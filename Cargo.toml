[package]
name = "rust_local_ai"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "A unified Rust interface to AI capabilities provided or managed by the operating system"
authors = ["Francesco Vezzani"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/kekko7072/rust_local_ai"
homepage = "https://vezz.io"
documentation = "https://docs.rs/rust_local_ai"
readme = "README.md"
keywords = ["ai", "local-ai", "on-device", "genui", "a2ui"]
categories = ["api-bindings", "os"]
include = ["src/**", "native/**", "examples/**", "tests/**", "build.rs", "README.md", "LICENSE-*", "Cargo.toml"]

[features]
default = []
testing = []
# Generative UI: turn a goal into a typed-block UI module (flutter_local_ai compatible).
genui = []
# Emit genUI modules as typed A2UI v0.9 protocol messages via `a2ui-types`.
a2ui = ["genui", "dep:a2ui-types"]

[dependencies]
a2ui-types = { version = "0.1", optional = true }
async-trait = "0.1"
futures-core = "0.3"
futures-util = "0.3"
pin-project-lite = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync"] }

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[example]]
name = "genui"
required-features = ["a2ui"]
