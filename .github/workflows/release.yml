name: Release

# Publishes the crate to crates.io when a GitHub release is published.
# The release tag must match the version in Cargo.toml (`v0.2.0` or `0.2.0`).
#
# Authentication uses crates.io trusted publishing (OIDC): configure it in the
# crate's crates.io settings for this repository, workflow `release.yml` and
# environment `crates-io`, and no stored token is needed. If trusted
# publishing is not configured, the `CARGO_REGISTRY_TOKEN` repository secret
# (a token with the `publish-update` scope) is used instead.
#
# Run it manually (Actions → Release → Run workflow) for a dry run that
# packages and verifies the crate without uploading it.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Package and verify without uploading to crates.io
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked --all-features

  publish:
    name: Publish to crates.io
    needs: test
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write # trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Check release tag matches Cargo.toml version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "rust_local_ai") | .version')
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::Release tag '$TAG' does not match Cargo.toml version '$version'"
            exit 1
          fi

      - name: Dry run
        if: github.event_name == 'workflow_dispatch' && inputs.dry-run
        run: cargo publish --dry-run --locked

      - name: Get a short-lived crates.io token (trusted publishing)
        id: auth
        if: github.event_name == 'release' || !inputs.dry-run
        # Falls back to the stored secret when trusted publishing is not set up.
        continue-on-error: true
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish
        if: github.event_name == 'release' || !inputs.dry-run
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::Neither trusted publishing nor the CARGO_REGISTRY_TOKEN secret is configured"
            exit 1
          fi
          cargo publish --locked
